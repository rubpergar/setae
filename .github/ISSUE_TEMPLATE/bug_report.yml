name: Bug report
description: Report a reproducible problem with Setae
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach microphone recordings or other private audio.
  - type: input
    id: version
    attributes:
      label: Setae version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: microphone
    attributes:
      label: Microphone and connection
      placeholder: USB headset, Bluetooth headset, laptop microphone
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
