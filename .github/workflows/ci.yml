name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Setae.sln -r win-x64

      - name: Build solution
        run: dotnet build Setae.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/Setae.App.Tests/Setae.App.Tests.csproj -c Release --no-build
